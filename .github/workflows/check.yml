name: Checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select current Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Check documentation links
        run: python3 scripts/check_links.py
      - name: Check dictation ownership and delayed callbacks
        run: |
          swift build --product sevra-voice-checks -j 3
          .build/debug/sevra-voice-checks
      - name: Check device-local scheduling and physical workbook identity
        run: |
          swift build --product sevra-automation-ui-checks -j 3
          .build/debug/sevra-automation-ui-checks
      - name: Build core checks
        run: |
          swift build --product sevra-extract -j 3
          swift build --product sevra-checks -j 3
      - name: Check isolated extraction and parser failure recovery
        run: |
          swift build --product sevra-extraction-checks -j 3
          .build/debug/sevra-extraction-checks
      - name: Run invariant and integration checks
        run: .build/debug/sevra-checks
      - name: Check search-scale fixture recall, paging and reports
        run: |
          swift build --product sevra-benchmark -j 3
          .build/debug/sevra-benchmark --self-check
      - name: Retain search-scale fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-scale-self-check
          path: |
            .build/search-scale-*/identity.json
            .build/search-scale-*/result.json
            .build/search-scale-*/rows-200.json
            .build/search-scale-*/documents-200.json
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Check document draft durability and native close guards
        run: |
          swift build --product sevra-document-checks -j 3
          .build/debug/sevra-document-checks
      - name: Check file-preview cancellation and stale reads
        run: |
          swift build --product sevra-preview-checks -j 3
          .build/debug/sevra-preview-checks
      - name: Check large linked-file verification and memory bound
        run: python3 scripts/check_large_preview.py --binary .build/debug/sevra-preview-checks --output .build/large-preview
      - name: Retain large-file verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: large-file-preview
          path: |
            .build/large-preview/result.json
            .build/large-preview/stdout.jsonl
            .build/large-preview/stderr.log
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Check checkpoint publication across process death
        run: |
          swift build --product sevra-context-durability -j 3
          python3 scripts/check_context_durability.py
      - name: Retain checkpoint process-death evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-process-death
          path: .build/context-durability-*/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Check native table identity and refresh races
        run: |
          swift build --product sevra-table-ui-checks -j 3
          .build/debug/sevra-table-ui-checks
      - name: Check foreground automation dispatch across process death
        run: |
          swift build --product sevra-automation-durability -j 3
          python3 scripts/check_automation_durability.py --output .build/automation-durability-ci
      - name: Retain automation process-death evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-process-death
          path: .build/automation-durability-ci/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Check manual workflow recovery across process death
        run: |
          swift build --product sevra-workflow-durability -j 3
          python3 scripts/check_workflow_durability.py --output .build/workflow-durability-ci
          swift build --product sevra -j 3
          python3 scripts/check_workflow_cli.py --cli .build/debug/sevra --worker .build/debug/sevra-workflow-durability --output .build/workflow-durability-ci/cli.json
      - name: Retain manual workflow recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-process-death
          path: .build/workflow-durability-ci/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Check native search navigation and stale reads
        run: |
          swift build --product sevra-search-ui-checks -j 3
          .build/debug/sevra-search-ui-checks
      - name: Check active model memory-pressure lifecycle
        run: |
          swift build --product sevra-product-checks -j 3
          .build/debug/sevra-product-checks
      - name: Check the native Splash adapter
        run: |
          swift build --product sevra-splash-checks -j 3
          .build/debug/sevra-splash-checks
          swift build --product sevra-native-setup -j 3
          .build/debug/sevra-native-setup --help
          if .build/debug/sevra-native-setup --unknown-option; then exit 1; fi
      - name: Check pinned native prompts and streamed outputs
        run: |
          swift build --product sevra-splash-text-checks -j 3
          python3 scripts/check_splash_text.py
          python3 scripts/check_performance_harness.py
      - name: Check complete-workbook performance fixtures and evidence gate
        run: |
          swift build --product sevra-workflow-performance -j 3
          .build/debug/sevra-workflow-performance --self-check
          python3 scripts/check_workflow_diagnostics.py
          python3 scripts/check_workflow_prefix.py
          python3 scripts/check_workflow_isolation.py
          python3 scripts/check_request_cache_isolation.py
          python3 scripts/check_item_reference_probe.py
      - name: Check native speculative grammar masks
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          python3 scripts/build_guidance.py
          swift build --product sevra-splash-grammar-checks -j 3
          swift build --product sevra-agent-checks -j 3
          python3 scripts/check_splash_grammar.py
      - name: Validate independent knowledge store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dbmd"
          cd "$RUNNER_TEMP/dbmd"
          ARCH=$(uname -m)
          if [ "$ARCH" = arm64 ]; then ARCH=aarch64; fi
          ASSET="dbmd-0.14.7-darwin-$ARCH.tar.gz"
          gh release download v0.14.7 --repo carloslfu/db.md --pattern "$ASSET" --pattern SHA256SUMS
          awk -v name="$ASSET" '$2 == name { print }' SHA256SUMS > selected.sha256
          test -s selected.sha256
          shasum -a 256 -c selected.sha256
          tar -xzf "$ASSET"
          "./dbmd-0.14.7-darwin-$ARCH/dbmd" validate --all "$GITHUB_WORKSPACE/db" --json
      - name: Build native app and CLI
        env:
          SEVRA_BUILD_JOBS: 3
        run: ./scripts/build.sh
      - name: Exercise packaged CLI and installation
        run: |
          python3 scripts/check_schedule_preview.py --cli output/bin/sevra --output .build/calendar-preview-installed
          python3 scripts/check_automation_definitions.py --cli output/bin/sevra --output .build/automation-definitions-installed
          python3 scripts/check_automation_planning.py --cli output/bin/sevra --output .build/automation-planning-installed
          python3 scripts/check_automation_execution.py --cli output/bin/sevra --output .build/automation-execution-installed
          python3 scripts/check_install.py
          python3 scripts/check_document_cli.py
          python3 scripts/check_history.py
          python3 scripts/check_receipts.py
          python3 scripts/check_concurrency.py --cli output/bin/sevra
          python3 scripts/check_urls.py
          python3 scripts/check_extraction_package.py --product output
          python3 scripts/check_computation_views.py --cli output/bin/sevra
          python3 scripts/check_document_actions.py --cli output/bin/sevra
          python3 scripts/check_workflow_intake.py --cli output/bin/sevra
          python3 scripts/check_workflow_lookup.py --cli output/bin/sevra
          python3 scripts/check_workflow_clarification.py --cli output/bin/sevra --worker .build/debug/sevra-workflow-durability
      - name: Build and check the isolated Splash preview
        env:
          SEVRA_BUILD_JOBS: 3
        run: |
          bash scripts/build_native.sh
          python3 scripts/check_native_package.py --paths-only
          python3 scripts/check_schedule_preview.py --cli output/native/bin/sevra --output .build/calendar-preview-native
          python3 scripts/check_automation_definitions.py --cli output/native/bin/sevra --output .build/automation-definitions-native
          python3 scripts/check_automation_planning.py --cli output/native/bin/sevra --output .build/automation-planning-native
          python3 scripts/check_automation_execution.py --cli output/native/bin/sevra --output .build/automation-execution-native
          python3 scripts/check_extraction_package.py
          python3 scripts/check_computation_views.py --cli output/native/bin/sevra
          python3 scripts/check_document_actions.py --cli output/native/bin/sevra
          python3 scripts/check_workflow_intake.py --cli output/native/bin/sevra
          python3 scripts/check_workflow_lookup.py --cli output/native/bin/sevra
          python3 scripts/check_workflow_clarification.py --cli output/native/bin/sevra --worker .build/debug/sevra-workflow-durability --skip-crashes
          SEVRA_NATIVE_CANDIDATE=1 swift build --scratch-path .build/native-product -c release --product sevra-extraction-checks -j 3
          .build/native-product/release/sevra-extraction-checks
