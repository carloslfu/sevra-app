name: Checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      full:
        description: Run every check and build the packaged app, as for a release
        type: boolean
        default: true
permissions:
  contents: read
# A newer push replaces an older run of the same branch.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    # A push runs the quick checks. A release tag or a manual run runs them all.
    timeout-minutes: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.full) && 90 || 40 }}
    env:
      FULL: ${{ startsWith(github.ref, 'refs/tags/') || inputs.full }}
      SEVRA_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v4
      - name: Select current Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install Rust for the grammar library, and dbmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          mkdir -p "$RUNNER_TEMP/dbmd"
          cd "$RUNNER_TEMP/dbmd"
          ARCH=$(uname -m)
          if [ "$ARCH" = arm64 ]; then ARCH=aarch64; fi
          ASSET="dbmd-0.14.7-darwin-$ARCH.tar.gz"
          gh release download v0.14.7 --repo carloslfu/db.md --pattern "$ASSET" --pattern SHA256SUMS
          awk -v name="$ASSET" '$2 == name { print }' SHA256SUMS > selected.sha256
          test -s selected.sha256
          shasum -a 256 -c selected.sha256
          tar -xzf "$ASSET"
          echo "$PWD/dbmd-0.14.7-darwin-$ARCH" >> "$GITHUB_PATH"
      - name: Build the packaged app
        if: env.FULL == 'true'
        run: bash scripts/build_native.sh
      - name: Run the checks
        run: |
          if [ "$FULL" = true ]; then bash scripts/check.sh; else bash scripts/check.sh --quick; fi
      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: |
            .build/*.json
            .build/*/result.json
            .build/*/*.jsonl
            .build/*/*.log
          include-hidden-files: true
          if-no-files-found: ignore
